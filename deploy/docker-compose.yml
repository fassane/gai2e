# Stack GAI2E Conseils sur le VPS : une instance par environnement (recette, prod),
# lancée avec `docker compose -p gai2e-<env>` depuis /opt/gai2e/<env>.
# La CI copie ce fichier à chaque déploiement ; le .env à côté est créé une fois
# à la main (voir deploy/README.md et deploy/.env.example).

x-app-env: &app-env
  NODE_ENV: production
  PORT: '8080'
  DATABASE_URL: postgresql://gai2e:${POSTGRES_PASSWORD}@postgres:5432/gai2e
  REDIS_URL: redis://redis:6379
  APP_VERSION: ${IMAGE_TAG}

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: gai2e
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: gai2e
    # Exposé sur la boucle locale seulement : sauvegardes, seed et Prisma Studio via tunnel SSH
    ports:
      - '127.0.0.1:${POSTGRES_PORT}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U gai2e']
      interval: 5s
      timeout: 5s
      retries: 10

  # Files de jobs du futur worker (notifications, rappels d'échéances)
  redis:
    image: redis:7
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redis-data:/data

  # Lancé par la CI avant chaque `up` : docker compose run --rm -T migrate < /dev/null
  migrate:
    image: ${IMAGE_REGISTRY}/gai2e-migrate:${IMAGE_TAG}
    profiles: ['tools']
    environment:
      DATABASE_URL: postgresql://gai2e:${POSTGRES_PASSWORD}@postgres:5432/gai2e
    depends_on:
      postgres:
        condition: service_healthy

  api:
    image: ${IMAGE_REGISTRY}/gai2e-api:${IMAGE_TAG}
    restart: unless-stopped
    env_file: .env
    environment: *app-env
    ports:
      - '127.0.0.1:${API_PORT}:8080'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  web:
    image: ${IMAGE_REGISTRY}/gai2e-web:${IMAGE_TAG}
    restart: unless-stopped
    ports:
      - '127.0.0.1:${WEB_PORT}:8080'

volumes:
  postgres-data:
  redis-data:
