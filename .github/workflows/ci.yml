name: CI (main)

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# Un push plus récent sur la même branche / PR annule l'exécution en cours
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/checks.yml
