name: build (Prod)

on:
  push:
    branches:
      - prod
  pull_request:
    branches:
      - prod

# Un push plus récent sur la même branche / PR annule l'exécution en cours (jamais un déploiement : voir deploy.yml)
concurrency:
  group: prod-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  packages: write

jobs:
  checks:
    uses: ./.github/workflows/checks.yml

  # Images + déploiement une fois les contrôles passés. Sur une PR, les images sont seulement construites.
  deploy:
    needs: checks
    uses: ./.github/workflows/deploy.yml
    permissions:
      contents: read
      packages: write
    with:
      environment: prod
      site-url: ${{ vars.PROD_SITE_URL }}
      deploy: ${{ github.event_name == 'push' }}
    secrets: inherit
