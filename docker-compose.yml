# Services de dev local : docker compose -p gai2e up -d
# Ports décalés pour cohabiter avec les autres projets (Ikoddi : 5432, Habaru : 5433 / 6379).
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: gai2e
      POSTGRES_PASSWORD: gai2e
      POSTGRES_DB: gai2e
    ports:
      - '5434:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - '6380:6379'
    volumes:
      - redis-data:/data

volumes:
  postgres-data:
  redis-data:
